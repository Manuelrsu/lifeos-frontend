name: lifeos
description: "LifeOS: todo tu progreso en una sola aplicación."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  # Textos de Material (calendario, botones) en español
  flutter_localizations:
    sdk: flutter
  # Peticiones HTTP a la API de Flask
  http: ^1.6.0
  # Estado de la app con ChangeNotifier (sencillo de explicar)
  provider: ^6.1.5+1
  # Guarda el token de sesión cifrado en el teléfono
  flutter_secure_storage: ^11.2.0
  # Fechas en español (es_CO). Versión fijada por flutter_localizations
  intl: 0.20.2
  # Preferencias locales que el backend no guarda (color de materia, tamaño del vaso)
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # Tipografía Poppins (licencia OFL, ver assets/fonts/OFL.txt)
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
